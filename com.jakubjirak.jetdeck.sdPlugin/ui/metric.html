<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>System Metric</title>
		<link rel="stylesheet" href="pi.css" />
		<script src="pi.js"></script>
	</head>
	<body>
		<div class="row">
			<label for="metric">Metric</label>
			<select id="metric" data-setting="metric">
				<option value="cpu">CPU (P / E cores)</option>
				<option value="gpu">GPU (load, power, memory)</option>
				<option value="ane">Neural Engine</option>
				<option value="ram">Memory</option>
				<option value="disk">Disk</option>
			</select>
		</div>
		<p class="hint">
			Sampled once per second by a native helper, without root. RAM colour follows macOS memory pressure, not the
			used share. Neural Engine shows the share of time it drives memory traffic.
		</p>
	</body>
</html>
